name: Pilote automatique

# Regarde la prochaine deadline FPL à chaque passage. Une heure avant, règle l'équipe
# (transferts, XI, capitaine, vice) une fois par journée et le signale dans une issue.
# À chaque passage, et avant d'attendre une deadline, vérifie aussi que la connexion tient.
# Il faut la variable FPL_ENTRY et le secret FPL_REFRESH_TOKEN (`fpl login --print`, cf.
# README) ; sans FPL_ENTRY, rien ne tourne. La FPL change le jeton à chaque usage : le
# dernier est gardé, chiffré, dans le cache (.github/actions/fpl-token).
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "17 8 * * *" # Un passage de plus : GitHub espace les autres de 3 à 6 heures.
  workflow_dispatch:
    inputs:
      force:
        description: "Régler l'équipe maintenant, même loin de la deadline"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # Compte rendu et alertes.

defaults:
  run:
    shell: bash # Avec pipefail : une requête qui échoue dans un pipe fait échouer l'étape.

env:
  GH_REPO: ${{ github.repository }}
  FPL_TOKEN_FILE: ${{ github.workspace }}/../fpl-token.json
  RELOGIN: >-
    relance `fpl login --print` en suivant ses étapes (fenêtre de navigation privée fermée
    aussitôt) et colle le jeton affiché dans le secret FPL_REFRESH_TOKEN (Settings > Secrets
    and variables > Actions).

jobs:
  window:
    # Depuis main seulement : le jeton gardé dans le cache d'une autre branche serait perdu.
    if: vars.FPL_ENTRY != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Voir si un autre passage attend déjà la deadline.
      contents: read
      issues: read
    outputs:
      run: ${{ steps.window.outputs.run }}
      gw: ${{ steps.window.outputs.gw }}
      season: ${{ steps.window.outputs.season }}
      wake: ${{ steps.window.outputs.wake }}
      check: ${{ steps.window.outputs.check }}
    steps:
      - uses: actions/checkout@v4
      - name: Fenêtre avant la deadline
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: .github/scripts/window.sh

  # À chaque passage (planifié, ou à la main sans « force » pour tester un nouveau jeton), sauf
  # s'il règle l'équipe tout de suite, et avant une longue attente : un jeton annulé se voit
  # vite, et l'heure de la coupure aide à en trouver la cause.
  check:
    needs: window
    if: >-
      ${{ !cancelled() && vars.FPL_ENTRY != '' && github.ref == 'refs/heads/main' &&
      (needs.window.outputs.run != 'true' || needs.window.outputs.check == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Un usage du jeton à la fois : deux rafraîchissements simultanés se gêneraient.
    concurrency:
      group: fpl-token
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - id: restore
        uses: ./.github/actions/fpl-token
        with:
          mode: restore
          secret: ${{ secrets.FPL_REFRESH_TOKEN }}
      - name: Connexion au compte
        id: whoami
        # Un jeton refusé ouvre une seule issue d'alerte (ci-dessous) : le passage reste vert
        # pour que GitHub n'envoie pas en plus un mail d'échec toutes les 3 à 6 heures.
        continue-on-error: true
        run: fpl whoami 2>&1 | tee "$RUNNER_TEMP/whoami.log"
      - name: Garder le nouveau jeton
        id: save
        if: always()
        uses: ./.github/actions/fpl-token
        with:
          mode: save
          secret: ${{ secrets.FPL_REFRESH_TOKEN }}
      - name: Alerte
        if: >-
          !cancelled() && (steps.restore.outcome == 'failure' || steps.whoami.outcome == 'failure'
          || steps.save.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          WHOAMI: ${{ steps.whoami.outcome }}
          SAVE: ${{ steps.save.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # La FPL renvoie souvent des 503 après les matchs : seul un jeton refusé demande de
          # se reconnecter, le reste ne laisse qu'un avertissement.
          if [ "$WHOAMI" = failure ] && [ "$SAVE" != failure ] &&
            ! grep -q invalid_grant "$RUNNER_TEMP/whoami.log"; then
            echo "::warning::Échec passager de la FPL, pas d'alerte."
            exit 0
          fi
          .github/scripts/alert.sh "Pilote automatique : connexion au compte FPL perdue" \
            "La vérification de la connexion a échoué : $RUN_URL

          Avant la prochaine deadline, sinon l'équipe ne sera pas réglée, $RELOGIN"

  # Hors du verrou du jeton : l'attente ne bloque ni la vérification de connexion, ni un
  # réglage manuel.
  wait:
    needs: [window, check]
    if: ${{ !cancelled() && needs.window.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # Au plus 330 minutes d'attente (cf. window.sh), sous la limite de 6 heures de GitHub.
    timeout-minutes: 340
    steps:
      - name: Attendre une heure avant la deadline
        env:
          WAKE: ${{ needs.window.outputs.wake }}
        run: |
          left=$(( WAKE - $(date +%s) ))
          if [ "$left" -gt 0 ]; then
            echo "Attente de $(( left / 60 )) min."
            sleep "$left"
          fi

  # Aussi si l'attente s'est interrompue (machine perdue) : mieux vaut régler tôt que jamais.
  autopilot:
    needs: [window, wait]
    if: ${{ !cancelled() && needs.window.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # Les 45 minutes entre le réveil et la dernière limite : l'alerte part avant la deadline.
    timeout-minutes: 45
    concurrency:
      group: fpl-token
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Pendant l'attente, un autre passage a pu régler l'équipe, ou la deadline bouger.
      - name: Toujours à faire
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          EXPECT_GW: ${{ needs.window.outputs.gw }}
        run: .github/scripts/window.sh

      - uses: actions/setup-python@v5
        if: steps.recheck.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.recheck.outputs.run == 'true'
        run: pip install -e ".[ml]"

      - name: Données à jour
        if: steps.recheck.outputs.run == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fpl pull --out data/gw.parquet
          published="$(gh release download data-latest -p latest.txt -O - 2>/dev/null || true)"
          # La publication du matin peut manquer une journée validée dans la journée.
          if [ "$(fpl latest)" != "$published" ]; then
            fpl ingest --strict --out data/gw.parquet
          fi

      - if: steps.recheck.outputs.run == 'true'
        uses: ./.github/actions/fpl-token
        with:
          mode: restore
          secret: ${{ secrets.FPL_REFRESH_TOKEN }}
      - name: Régler l'équipe
        id: apply
        if: steps.recheck.outputs.run == 'true'
        timeout-minutes: 15
        env:
          FPL_ENTRY: ${{ vars.FPL_ENTRY }}
          GW: ${{ needs.window.outputs.gw }}
        run: fpl autopilot --entry "$FPL_ENTRY" --gw "$GW" --apply --report report.md
      - name: Garder le nouveau jeton
        if: always() && steps.recheck.outputs.run == 'true'
        uses: ./.github/actions/fpl-token
        with:
          mode: save
          secret: ${{ secrets.FPL_REFRESH_TOKEN }}

      # Juste après l'envoi, même si garder le jeton a échoué : ce compte rendu marque la
      # journée comme faite, sans lui le passage suivant renverrait l'équipe.
      - name: Compte rendu
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.recheck.outputs.title }}
        run: |
          gh label create autopilot --color 1D76DB --description "Pilote automatique FPL" --force
          url="$(gh issue create --title "$TITLE" --label autopilot --body-file report.md)"
          gh issue close "$url" # Un journal : la notification suffit.

      # Aussi quand le passage dépasse son temps (GitHub l'annule alors).
      - name: Alerte en cas d'échec
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ needs.window.outputs.season }}
          GW: ${{ needs.window.outputs.gw }}
          APPLIED: ${{ steps.apply.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$APPLIED" = "success" ]; then
            state="L'équipe a bien été réglée, mais la suite a échoué (compte rendu ou jeton)."
          else
            state="L'équipe n'a pas été réglée, ou seulement en partie (les détails disent
          quoi)."
          fi
          .github/scripts/alert.sh "$SEASON J$GW : échec du pilote automatique" "$state

          Détails : $RUN_URL

          Si l'erreur parle de connexion ou de jeton, $RELOGIN"
